name: STRATA CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-and-validate:
    name: Lint, Compile & Validate Lattice
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce Release Flow (Only dev -> main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "::error::Pull requests targeting 'main' must originate from 'dev' (got '${{ github.head_ref }}'). Please merge into 'dev' first."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pydantic pydantic-settings rich

      - name: Static Analysis & Undefined Names Gate
        run: |
          python scripts/check_static.py

      - name: Enforce Zero frozenset in src/ and scripts/
        run: |
          python -c "import ast, pathlib, sys; hits = [f'{p}:{n.lineno}' for d in ('src', 'scripts') for p in sorted(pathlib.Path(d).rglob('*.py')) for n in ast.walk(ast.parse(p.read_text(encoding='utf-8'), str(p))) if isinstance(n, ast.Name) and n.id == 'frozenset']; print('frozenset hits:', hits) if hits else print('ZERO_FROZENSET_OK'); sys.exit(1 if hits else 0)"

      - name: Domain Tree Schema & Integrity Linting
        run: |
          python scripts/lint_trees.py

      - name: Strict Five-Axis Tree Audit
        run: |
          python scripts/audit_trees.py --strict-five-axis

      - name: Compile Domain Trees to SQLite Lattice
        run: |
          python strata_cli.py compile

      - name: Validate Compiled Lattice AST Nodes
        run: |
          python strata_cli.py validate

      - name: Audit Lattice Topological Connectivity
        run: |
          python strata_cli.py audit

      - name: Run Core Symbolic & Topological Unit Tests
        run: |
          pytest tests/test_soundness_topology.py
