name: STRATA CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-and-validate:
    name: Lint, Compile & Validate Lattice
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce Release Flow (Only dev -> main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "::error::Pull requests targeting 'main' must originate from 'dev' (got '${{ github.head_ref }}'). Please merge into 'dev' first."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" opencv-python-headless pillow pandas matplotlib

      - name: Static Analysis, Neutrality & Undefined Names Gate
        run: |
          python scripts/check_static.py

      - name: Enforce Zero frozenset Across Codebase
        run: |
          python -c "import ast, pathlib, sys; hits = [f'{p}:{n.lineno}' for d in ('src', 'scripts', 'tools', 'benchmarks', 'tests') if pathlib.Path(d).is_dir() for p in sorted(pathlib.Path(d).rglob('*.py')) for n in ast.walk(ast.parse(p.read_text(encoding='utf-8'), str(p))) if isinstance(n, ast.Name) and n.id == 'frozenset']; print('frozenset hits:', hits) if hits else print('ZERO_FROZENSET_OK'); sys.exit(1 if hits else 0)"

      - name: Domain Tree Schema & Integrity Linting
        run: |
          python scripts/lint_trees.py --include-fixtures

      - name: Strict Five-Axis & Neutrality Tree Audit
        run: |
          python scripts/audit_trees.py --strict-five-axis --strict-neutral --include-fixtures

      - name: Canonical Manifest Idempotency Check
        run: |
          python scripts/neutralize_trees.py --check --include-fixtures

      - name: Compile, Validate & Audit SQLite v4 Lattice
        run: |
          python strata_cli.py compile --clean
          python strata_cli.py validate
          python strata_cli.py audit

      - name: Deterministic Unit & Integration Suite (pytest)
        run: |
          pytest tests/ -v

      - name: Theory-First Pure Symbolic Matrix (Profile 0)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: |
          python test.py --profiles 0 --early-stop
