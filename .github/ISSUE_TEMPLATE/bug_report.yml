name: Bug Report
description: Report a defect, unexpected error, or failed synthesis in STRATA
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in STRATA! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Prompt, CLI command, or code snippet that reproduces the issue.
      placeholder: |
        1. Run `python nstl_cli.py run "..."`
        2. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Traceback
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Linux (Ubuntu/Debian)
        - Windows
        - macOS
    validations:
      required: true
