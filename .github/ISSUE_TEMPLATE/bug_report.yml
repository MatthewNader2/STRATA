name: Bug Report
description: Report a synthesis defect, soundness violation, or runtime failure in STRATA v2
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with STRATA v2. Please include the exact profile (`0`, `A`..`O`), prompt or formal IR, and validation outputs.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear summary of expected vs actual behavior (e.g. unexpected refusal, unsound coercion, sandbox failure).
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: Profile & Method
      description: e.g. `profile=0` or `profile=O`, `--use-reranker` on/off
      placeholder: "profile=0 (Pure Symbolic)"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Prompt / Command to Reproduce
      description: Exact `strata_cli.py run ...`, `test.py --profiles ... --cases ...`, or minimal pytest snippet.
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Static Audit Output
      description: Python version, OS, local LLM/embedder names (if neural profile), and output of `python3 scripts/check_static.py`.
      render: shell
    validations:
      required: false
